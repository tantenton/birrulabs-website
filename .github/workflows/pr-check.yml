name: PR Check & Review

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Check PR description
        uses: iesri/action-pr-description-checker@v1
        if: false

      - name: Check for breaking changes
        run: |
          if git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -E "(package-lock\.json|yarn\.lock|package\.json)"; then
            echo "Dependencies changed - ensure version bumps are correct"
          fi

      - name: Check for sensitive data
        uses: grandrounds/leave-no-secret@v1
        with:
          format: text
          paths_to_exclude: "**/.env*,**/*.log"

  deploy-preview:
    name: Deploy PR Preview (Vercel)
    runs-on: ubuntu-latest
    needs: pr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next/

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy PR Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_ENV: preview
        run: |
          vercel --preb